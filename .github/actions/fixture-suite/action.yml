name: Synthetic fixture suite
description: Run every registered synthetic fixture case from the fixture manifest
inputs:
  variant:
    description: native or asan
    required: true
  shard:
    description: one-based fixture shard in I/N form
    required: false
    default: 1/1
runs:
  using: composite
  steps:
    - name: Run registered fixture cases
      shell: bash
      run: |
        python3 tools/fixtures/run_fixture_suite.py \
          --variant "${{ inputs.variant }}" \
          --shard "${{ inputs.shard }}" \
          --binary "$SPHERE_FIXTURE_BINARY" \
          --root "$RUNNER_TEMP"
