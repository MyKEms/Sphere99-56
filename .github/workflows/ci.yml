name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (32-bit Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-multilib make

      - name: Test CRefPtr null semantics
        run: python3 tools/test_refptr.py

      - name: Build
        run: make -j"$(nproc)" 2>&1 | tee build.log

      - name: Reject command-line options before startup
        run: python3 tools/test_command_line.py --binary ./sphere99svr

      - name: Run container-list regression
        run: |
          make container-list-test
          build/container-list/container_list_test

      - name: Run string-sort-array regression
        run: |
          make string-sort-array-test
          build/string-sort-array/string_sort_array_test

      - name: Reject non-trivial objects through C varargs
        run: |
          if grep -Eq 'passing objects of non-trivially-copyable type .* through' build.log; then
            echo 'non-trivially-copyable object passed through a C varargs boundary'
            exit 1
          fi

      - name: Check binary
        run: file sphere99svr | grep -q 'ELF 32-bit'

      - name: Warning summary
        if: always()
        run: |
          {
            echo "### Compiler warnings"
            echo ""
            echo "Total: $(grep -c 'warning:' build.log || true)"
            echo ""
            echo '| count | kind |'
            echo '|---:|---|'
            grep -o '\[-W[a-z0-9+=-]*\]' build.log | sort | uniq -c | sort -rn | head -15 \
              | awk '{print "| " $1 " | `" $2 "` |"}'
          } >> "$GITHUB_STEP_SUMMARY"

  asan:
    name: Build (ASan/UBSan x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SPHERE_FIXTURE_BINARY: ${{ github.workspace }}/build/asan/sphere99svr
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make python3

      - name: Build sanitizer target
        run: make asan 2>&1 | tee asan-build.log

      - name: Reject non-trivial objects through C varargs
        run: |
          if grep -Eq 'passing objects of non-trivially-copyable type .* through' asan-build.log; then
            echo 'non-trivially-copyable object passed through a C varargs boundary'
            exit 1
          fi

      - name: Check binary
        run: file build/asan/sphere99svr | grep -q 'ELF 64-bit'

      - name: Run container-list regression under ASan/UBSan
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          make container-list-asan-test
          build/asan-container-list/container_list_test

      - name: Run string-sort-array regression under ASan/UBSan
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          make string-sort-array-asan-test
          build/asan-string-sort-array/string_sort_array_test

      - name: Verify crash recovery is opt-in
        run: |
          if nm -a build/asan/sphere99svr | grep -Eq 'sig(long)?jmp|CrashHandler'; then
            echo 'ASan build unexpectedly contains legacy crash recovery'
            exit 1
          fi

      - name: Run synthetic fixture suite under ASan/UBSan
        uses: ./.github/actions/fixture-suite
        with:
          variant: asan

      - name: Run integrity watchdog fixture under ASan/UBSan
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          make integrity-asan-test
          build/asan-integrity/integrity_test 2>&1 | tee integrity-asan-test.log
          grep -q 'CRITICAL.*rule=parent_missing' integrity-asan-test.log

      - name: Upload ASan fixture server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: asan-fixture-server-log
          path: ${{ runner.temp }}/sphere-asan-*/*
          if-no-files-found: warn


  load-safety:
    name: World-load save guard
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-multilib make

      - name: Run disposable broken-world regression
        run: |
          make load-safety-test
          build/load-safety/load_safety_test

      - name: Run checked-save I/O fault injection
        run: |
          make save-io-test
          build/save-io/save_io_test

  integrity:
    name: World-integrity watchdog
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-multilib make

      - name: Run injected-corruption regression
        run: |
          make integrity-test
          build/integrity/integrity_test 2>&1 | tee integrity-test.log
          grep -q 'CRITICAL.*rule=parent_missing' integrity-test.log

  value-ranges:
    name: Value-range properties and script lookup tables
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-multilib make

      - name: Run offline regressions
        run: |
          make value-range-test
          build/value-range/value_range_test
          python3 tools/fixtures/test_resource_type_ids.py

  lint:
    name: Lint tools
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Test fixture shutdown gate
        run: python3 tools/fixtures/test_run_suite.py

      - name: Test fixture runner port ownership
        run: python3 tools/fixtures/test_runner_safety.py

      - name: Validate fixture manifest
        run: python3 tools/fixtures/test_fixture_manifest.py

      - name: Python syntax
        run: python3 -m py_compile tools/*.py tools/fixtures/*.py

      - name: Public boundary and secret scan
        run: python3 tools/check_secrets.py --all

      - name: Offline protocol fixtures
        run: python3 tools/test_protocol.py

      - name: Stock log format and diff regression
        run: python3 tools/test_logdiff.py

      - name: External denylist unit checks
        run: python3 tools/test_secret_denylist.py

      - name: shellcheck
        run: shellcheck tools/*.sh

  fixture:
    name: Headless synthetic fixture (32-bit Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SPHERE_FIXTURE_BINARY: ${{ github.workspace }}/sphere99svr
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-multilib make python3

      - name: Build i386 server
        run: make -j"$(nproc)"

      - name: Run synthetic fixture suite
        uses: ./.github/actions/fixture-suite
        with:
          variant: native

      - name: Upload fixture server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-fixture-server-log
          path: ${{ runner.temp }}/sphere-*/*
          if-no-files-found: warn
